services:
  - type: web
    name: pharmacy-assistant-api
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-assistant-postgres
          property: connectionString
      - key: DB_AUTO_CREATE
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pharmacy-assistant-frontend.pages.dev
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https://([a-z0-9-]+\.)?pharmacy-assistant-frontend\.pages\.dev$
      - key: APP_PUBLIC_BASE_URL
        value: https://pharmacy-assistant-frontend.pages.dev
      - key: PHARMACY_ADMIN_EMAIL
        sync: false
      - key: PHARMACY_ADMIN_PASSWORD
        sync: false
      - key: PHARMACY_ADMIN_FULL_NAME
        value: Admin
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_ROUTER_MODEL
        value: google/gemini-2.0-flash-001
      - key: OPENROUTER_MAIN_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_FALLBACK_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: OPENROUTER_EMBED_MODEL
        value: openai/text-embedding-3-small
      - key: OPENROUTER_EMBED_DIM
        value: "1536"
      - key: OPENROUTER_HTTP_REFERER
        value: https://pharmacy-assistant-frontend.pages.dev
      - key: OPENROUTER_X_TITLE
        value: Pharmacy Assistant
      - key: RAG_TOP_K
        value: "6"
      - key: RAG_MIN_SCORE
        value: "0.35"
      - key: RAG_MIN_SCORE_SHORT
        value: "0.15"
      - key: RAG_RETRIEVAL_MODE
        value: vector
      - key: RAG_EMBEDDINGS_ENABLED
        value: "1"
      - key: RAG_SOURCES_MAX_CHARS
        value: "6000"
      - key: PRESCRIPTION_STORAGE
        value: r2
      - key: PRESCRIPTION_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: pharmacy-prescriptions
      - key: R2_REGION
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ENABLE_APPOINTMENT_REMINDERS
        value: "true"
      - key: REMINDER_POLL_SECONDS
        value: "300"

databases:
  - name: pharmacy-assistant-postgres
    databaseName: pharmacy
    user: pharmacy
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList:
      - source: 0.0.0.0/0
        description: Cloudflare backend egress; tighten after final runtime is known.
