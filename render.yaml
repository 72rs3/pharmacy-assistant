services:
  - type: web
    name: pharmacy-assistant-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerContext: .
    dockerfilePath: ./Dockerfile.demo
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_AUTO_CREATE
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pharmacy-assistant-demo.onrender.com
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https://pharmacy-assistant-demo\.onrender\.com$
      - key: APP_PUBLIC_BASE_URL
        value: https://pharmacy-assistant-demo.onrender.com
      - key: PHARMACY_ADMIN_EMAIL
        sync: false
      - key: PHARMACY_ADMIN_PASSWORD
        sync: false
      - key: PHARMACY_ADMIN_FULL_NAME
        value: Admin
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_ROUTER_MODEL
        value: google/gemini-2.0-flash-001
      - key: OPENROUTER_MAIN_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_FALLBACK_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: OPENROUTER_CHAT_MODEL
        value: deepseek/deepseek-r1-0528:free
      - key: OPENROUTER_EMBED_MODEL
        value: openai/text-embedding-3-small
      - key: OPENROUTER_EMBED_DIM
        value: "1536"
      - key: OPENROUTER_TEMPERATURE
        value: "0.2"
      - key: OPENROUTER_TIMEOUT_S
        value: "60"
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "30"
      - key: OPENROUTER_MAX_RETRIES
        value: "1"
      - key: OPENROUTER_MAX_TOKENS
        value: "400"
      - key: OPENROUTER_ROUTER_MAX_TOKENS
        value: "150"
      - key: OPENROUTER_MAIN_MAX_TOKENS
        value: "600"
      - key: OPENROUTER_FALLBACK_MAX_TOKENS
        value: "900"
      - key: OPENROUTER_HTTP_REFERER
        value: https://pharmacy-assistant-demo.onrender.com
      - key: OPENROUTER_X_TITLE
        value: Pharmacy Assistant
      - key: RAG_TOP_K
        value: "6"
      - key: RAG_MIN_SCORE
        value: "0.35"
      - key: RAG_MIN_SCORE_SHORT
        value: "0.15"
      - key: RAG_RETRIEVAL_MODE
        value: vector
      - key: RAG_EMBEDDINGS_ENABLED
        value: "1"
      - key: RAG_SOURCES_MAX_CHARS
        value: "6000"
      - key: PRESCRIPTION_STORAGE
        value: local
      - key: PRESCRIPTION_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ENABLE_APPOINTMENT_REMINDERS
        value: "false"
      - key: REMINDER_POLL_SECONDS
        value: "300"
